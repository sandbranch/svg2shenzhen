# Unit tests, and bitmap2component for Linux (static), macOS and Windows,
# packed with the extension into one zip per platform. A tag v* makes a
# release with the zips.
name: build
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # inkex without PyGObject, which only its GUI helpers need
      - run: pip install --no-deps inkex==1.4.0
      - run: pip install "lxml>=4.5,<6" numpy pillow pytest tinycss2 cssselect pyparsing packaging
      - run: python -m pytest -q tests/test_units.py

  tracer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux64
            binary: bitmap2component_linux64
          - os: macos-latest
            name: osx
            binary: bitmap2component_osx
          - os: windows-latest
            name: windows
            binary: bitmap2component.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - if: matrix.os == 'macos-latest'
        run: brew install boost
      - if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-boost
      - name: build
        run: |
          case "${{ matrix.name }}" in
            linux64) make -j4 CXXFLAGS="-std=c++11 -O2" LIBS="-static" ;;
            osx) make -j4 CXXFLAGS="-std=c++11 -O2 -I$(brew --prefix boost)/include" ;;
            windows) make -j4 CXXFLAGS="-std=c++11 -O2" LIBS="-static" ;;
          esac
          ls -la bitmap2component*
          mv bitmap2component bitmap2component.tmp 2>/dev/null || true
          mv bitmap2component.exe bitmap2component.tmp 2>/dev/null || true
          mkdir -p dist/stage
          cp -r inkscape/* dist/stage/
          cp bitmap2component.tmp "dist/stage/svg2shenzhen/${{ matrix.binary }}"
          chmod +x "dist/stage/svg2shenzhen/${{ matrix.binary }}"
          version=$(git describe --tags --always)
          for f in dist/stage/*.inx; do sed -i.bak "s/SVGSZ_VER/$version/g" "$f" && rm "$f.bak"; done
          (cd dist/stage && zip -r "../svg2shenzhen-${version}-${{ matrix.name }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: svg2shenzhen-${{ matrix.name }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, tracer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
